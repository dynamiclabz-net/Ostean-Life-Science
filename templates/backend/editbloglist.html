<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Blogs</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h1 class="text-center mb-4">Edit Blog Posts</h1>

      <!-- Blog List -->
      <div class="list-group">
        {% for blog in blogs %}
        <a
          href="{% url 'edit_blog' blog.slug %}"
          class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
        >
          <div>
            <h5 class="mb-1">{{ blog.title }}</h5>
            <p class="mb-0 text-muted">
              Published: {{ blog.published_at|date:"F d, Y" }}
            </p>
          </div>
          <span class="badge bg-primary text-white">Edit</span>
        </a>
        {% empty %}
        <div class="alert alert-warning text-center">
          No blogs available to edit.
        </div>
        {% endfor %}
      </div>

      <!-- Back to Home Button -->
      <div class="text-center mt-4">
        <a href="/blog/posts" class="btn btn-secondary">Back to Home</a>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
